version: '3.8'

services:
  career_coach:
    build: .
    container_name: cse_career_coach
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./automation_engine.db:/app/automation_engine.db
      - ./backups:/app/backups
    environment:
      - TIMEZONE=Asia/Kolkata
